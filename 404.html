<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Road2Care - Redirecting</title>
    <script>
      // Single Page App redirect for GitHub Pages and Cloudflare Pages
      var pathSegmentsToKeep = 0;
      var l = window.location;
      // If hosted on https://<username>.github.io/<repo>/
      if (l.pathname.split('/').length > 2 && l.hostname.indexOf('github.io') !== -1) {
        pathSegmentsToKeep = 1;
      }
      var cleanPath = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
      l.replace(
        l.protocol + '//' + l.host + (pathSegmentsToKeep ? '/' + l.pathname.split('/')[1] : '') + '/#/' +
        cleanPath + (l.search ? '?' + l.search.slice(1) : '') + l.hash
      );
    </script>
  </head>
  <body>
    <p>Redirecting to Road2Care...</p>
  </body>
</html>
